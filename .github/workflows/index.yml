name: Rebuild plugin index

on:
  push:
    branches: [main]
    paths:
      - "*.plugin"
      - "tools/build_extera_index.py"

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild extera-plugins.json
        run: python tools/build_extera_index.py "$GITHUB_WORKSPACE"

      - name: Commit index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet extera-plugins.json; then
            echo "Index unchanged"
          else
            git add extera-plugins.json
            git commit -m "chore: rebuild extera plugin index"
            git push
          fi
